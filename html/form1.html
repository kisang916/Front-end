<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--  action - 자바에서만들파일로보내짐 폼누르면 
      method get 방식은 주소에다 담아서 서버에 보내는것임(빠름)
      post는 서버로보낼때 주소에보이진않음 바디에넣어서보내기에
      (느림)-->



    <form action="aa.jsp" method="get">
        <label for="idName">아이디</label>
        <input type="text" name="id" id="idName" required placeholder="아이디는 이메일"
                maxlength="5" size="8" value="admin" readonly><!-- 못고치게하는거-리드온리 -->
        <br>

        <label for="pwd">비밀번호</label>
        <input type="password" name="pw" id="pwd" required placeholder="대문자 소문자8자이상">
        <br>

        <label for="phone">전화번호</label>
        <input type="hidden" name="phone" id="phone" value="010-1234-5678">
        <br>


        <input type="submit" value="로그인">
    </form>



</body>
</html>
